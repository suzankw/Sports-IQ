openapi: 3.1.0
info:
  title: Sports IQ API
  version: 1.0.0
  description: |
    The contract for the Sports IQ API (St. Andrew's School, Turi). Server and client both follow this file:
    the server validates every request against it at runtime and every response in tests.
    Conventions, the permission matrix and worked examples are in `docs/03-api.md`.

    - Success: `{ "data": … }`, plus `"meta"` on lists. Errors: `{ "error": { "code", "message", "details" } }`.
    - Dates are ISO 8601 in UTC. The client shows them in EAT (Africa/Nairobi).
    - Query filters use slugs for sport, team and season (they come from page URLs). Request bodies always use ids.
    - Reads are public unless marked otherwise. Every write needs the `siq_session` cookie.
servers:
  - url: /api/v1
security: []
tags:
  - name: Auth
  - name: Sports
  - name: Seasons
  - name: Schools
  - name: Competitions
  - name: Teams
  - name: Team seasons
  - name: Players
  - name: Users
  - name: Matches
  - name: League results
  - name: Inductees
  - name: Uploads

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: Login page. Sets the `siq_session` cookie. Limited to 10 attempts per 15 minutes per IP and email.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password, or the account is disabled (same message for all three)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: UNAUTHENTICATED, message: Invalid email or password, details: [] } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Avatar menu → Sign out. Clears the cookie.
      operationId: logout
      security: [{ cookieAuth: [] }]
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and permissions
      description: |
        Every page (avatar menu, dashboard menus and guards). `data` is null for a visitor who isn't signed in
        (a 200, not a 401, so public pages don't log a browser console error on every load).
      operationId: getMe
      responses:
        '200':
          description: The signed-in user, or null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    anyOf: [{ $ref: '#/components/schemas/Me' }, { type: 'null' }]
    patch:
      tags: [Auth]
      summary: Update my profile
      description: D17 My account. Name, title and photo only.
      operationId: updateMe
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/password:
    post:
      tags: [Auth]
      summary: Change my password
      description: |
        D17 My account, and the forced change after a temporary password (allowed even when `mustChangePassword` is true).
        Revokes every other session and sets a fresh cookie.
      operationId: changePassword
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeInput' }
      responses:
        '200':
          description: Password changed
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Sports ─────────────────────────────
  /sports:
    get:
      tags: [Sports]
      summary: List sports
      description: Public sidebar (every page), D3 Sports list. Ordered by `order`.
      operationId: listSports
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Sports
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SportSummary' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Sports]
      summary: Create a sport
      description: D3 Sports. Admin only. Starts as `comingSoon`; definitions are added with PATCH.
      operationId: createSport
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SportCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sports/{sport}:
    parameters:
      - $ref: '#/components/parameters/SportPath'
    get:
      tags: [Sports]
      summary: Get a sport with its definitions and content
      description: D3/D4 edit form. Public, so result entry and stats pages can render from the definitions.
      operationId: getSport
      responses:
        '200':
          description: The sport
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SportResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sports]
      summary: Update a sport's definitions or overview content
      description: D3 Sports (definition tab) and D4 Sport page content. Admin only. Stat keys already used by matches can't be removed or renamed.
      operationId: updateSport
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SportUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sports/{sport}/overview:
    parameters:
      - $ref: '#/components/parameters/SportPath'
    get:
      tags: [Sports]
      summary: Sport Overview page
      description: |
        Public Overview page in one call: the sport with its content, the next 4 fixtures across all its teams,
        the top 4 scorers across its teams this season, and the top 4 of the first team's league table.
      operationId: getSportOverview
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SportOverview' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Seasons ─────────────────────────────
  /seasons:
    get:
      tags: [Seasons]
      summary: List seasons
      description: Season selects on every page, D5 Seasons. Newest first.
      operationId: listSeasons
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Seasons
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Season' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Seasons]
      summary: Create a season
      description: D5 Seasons. Admin only. `isCurrent = true` unsets the previous current season.
      operationId: createSeason
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /seasons/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Seasons]
      summary: Update a season
      description: D5 Seasons. Admin only.
      operationId: updateSeason
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Seasons]
      summary: Delete a season
      description: D5 Seasons. Admin only. 409 if any team-season, match or league result uses it.
      operationId: deleteSeason
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Schools ─────────────────────────────
  /schools:
    get:
      tags: [Schools]
      summary: List schools
      description: Shell crest (`home=true`), opponent pickers, D8 Schools. Sorted by name.
      operationId: listSchools
      parameters:
        - name: home
          in: query
          description: true = only Turi, false = only opponents
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Schools
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/School' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Schools]
      summary: Add an opponent school
      description: D8 Schools. Admin only.
      operationId: createSchool
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /schools/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Schools]
      summary: Update a school (including Turi)
      description: D8 Schools. Admin only.
      operationId: updateSchool
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Schools]
      summary: Delete an opponent school
      description: D8 Schools. Admin only. 409 for Turi or if any match or league result uses it.
      operationId: deleteSchool
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Competitions ─────────────────────────────
  /competitions:
    get:
      tags: [Competitions]
      summary: List competitions
      description: Fixture and league-result pickers, D7 Competitions. Sorted by name.
      operationId: listCompetitions
      parameters:
        - $ref: '#/components/parameters/SportQuery'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CompetitionType' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Competitions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Competition' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Competitions]
      summary: Create a competition
      description: D7 Competitions. Admin only.
      operationId: createCompetition
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompetitionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /competitions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Competitions]
      summary: Update a competition
      description: D7 Competitions. Admin only. The sport can't change.
      operationId: updateCompetition
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompetitionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Competitions]
      summary: Delete a competition
      description: D7 Competitions. Admin only. 409 if any match, league result or team-season uses it.
      operationId: deleteCompetition
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /competitions/{id}/standings:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Competitions]
      summary: League table
      description: |
        Public League Table page. Computed from published, completed Turi matches plus other schools' results.
        Sorted by points, then goal difference, then goals for, then name.
      operationId: getStandings
      parameters:
        - $ref: '#/components/parameters/SeasonQuery'
      responses:
        '200':
          description: Standings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Standings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Teams ─────────────────────────────
  /teams:
    get:
      tags: [Teams]
      summary: List teams
      description: D6 Teams, team pickers. Sorted by sport, then `order`.
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/SportQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Team' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Teams]
      summary: Create a team
      description: D6 Teams. Admin only.
      operationId: createTeam
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Teams]
      summary: Update a team
      description: D6 Teams. Admin only. Sport and slug can't change.
      operationId: updateTeam
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teams]
      summary: Delete a team
      description: D6 Teams. Admin only. 409 if it has any team-season.
      operationId: deleteTeam
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Team seasons ─────────────────────────────
  /team-seasons:
    get:
      tags: [Team seasons]
      summary: List team-seasons
      description: |
        Team tabs and selects on Roster, Season Stats and League Table (`sport` + `season`), resolving a page URL
        to an id (`sport` + `team` + `season`), D6/D9/D12 pickers. `mine=true` lists the caller's assignments.
        Sorted by team `order`.
      operationId: listTeamSeasons
      parameters:
        - $ref: '#/components/parameters/SportQuery'
        - $ref: '#/components/parameters/TeamQuery'
        - $ref: '#/components/parameters/SeasonQuery'
        - $ref: '#/components/parameters/MineQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Team-seasons
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TeamSeasonSummary' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Team seasons]
      summary: Enter a team in a season
      description: D6 Teams (season setup). Admin only. `copyFrom` copies the members of another team-season of the same team (captain and depth chart are not copied).
      operationId: createTeamSeason
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamSeasonCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSeasonResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /team-seasons/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Team seasons]
      summary: Roster page
      description: |
        Public Roster page and D12 Roster editor in one call: squad, captain, depth chart, coaches, season quote,
        roster analytics and the 3 most recent published match photos.
      operationId: getTeamSeason
      responses:
        '200':
          description: The team-season
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSeasonResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Team seasons]
      summary: Update league and season quote
      description: D6 Teams. Admin only.
      operationId: updateTeamSeason
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamSeasonUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSeasonResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Team seasons]
      summary: Remove a team from a season
      description: D6 Teams. Admin only. 409 if it has matches or coach assignments.
      operationId: deleteTeamSeason
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /team-seasons/{id}/squad:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Team seasons]
      summary: Save the whole squad
      description: |
        D12 Roster. Coach (own team-season) or admin. Replaces members, captain and depth chart in one request.
        Rules: shirt numbers unique, positions exist for the sport, captain and depth-chart players are members.
      operationId: saveSquad
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SquadInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSeasonResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /team-seasons/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Team seasons]
      summary: Season Statistics page
      description: |
        Public Season Statistics page, all four tabs in one call: KPIs, team form (last 10), every leaderboard
        (top 10), records and the season quote. Counts only published, completed matches.
      operationId: getSeasonStats
      responses:
        '200':
          description: Season statistics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SeasonStats' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Players ─────────────────────────────
  /players:
    get:
      tags: [Players]
      summary: List or search players
      description: D11 Players, D12 "add player" search. Public fields only.
      operationId: listPlayers
      parameters:
        - name: search
          in: query
          description: Matches the start of the first or last name, case-insensitive
          schema: { type: string, minLength: 2, maxLength: 60 }
        - $ref: '#/components/parameters/TeamSeasonQuery'
        - name: sort
          in: query
          schema: { type: string, enum: [lastName, -lastName], default: lastName }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Players
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Player' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Players]
      summary: Create a player
      description: D11 Players, D12 Roster ("new player"). Any coach or admin. Added to a squad with PUT /team-seasons/{id}/squad.
      operationId: createPlayer
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /players/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Players]
      summary: Update a player
      description: D11 Players. Coach if the player is in a squad of one of their team-seasons, or admin.
      operationId: updatePlayer
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Players]
      summary: Delete a player
      description: D11 Players. Admin only. 409 if the player is in any squad, match or Hall of Fame entry.
      operationId: deletePlayer
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Users ─────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List staff accounts
      description: D9 Users. Admin only. Sorted by name.
      operationId: listUsers
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a staff account
